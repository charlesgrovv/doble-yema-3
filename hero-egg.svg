<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="eggWhite" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#fffdfa" />
      <stop offset="60%" stop-color="#fff2c8" />
      <stop offset="100%" stop-color="#e8daa9" />
    </radialGradient>
    <radialGradient id="yolk" cx="40%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#fff5ae" />
      <stop offset="40%" stop-color="#ffd24f" />
      <stop offset="100%" stop-color="#eb9f12" />
    </radialGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="lineTexture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="3" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="2">
        <feDistantLight azimuth="45" elevation="60" />
      </feDiffuseLighting>
      <feComposite in2="SourceGraphic" operator="in" />
    </filter>
  </defs>
  <rect width="1200" height="900" rx="80" ry="80" fill="#fbf5df" />
  <g filter="url(#softShadow)">
    <path d="M300 220 C250 420 180 620 340 730 C520 820 790 860 930 730 C1020 640 1080 480 1040 330 C1010 220 900 170 760 150 C620 130 520 140 430 180 C360 210 340 240 300 220 Z" fill="url(#eggWhite)" />
    <path d="M320 270 C290 420 300 520 360 600 C430 700 540 760 660 760 C780 760 860 690 900 600 C940 520 930 390 870 300 C820 230 720 220 640 210 C540 200 450 210 360 240 C340 250 330 260 320 270 Z" fill="url(#eggWhite)" opacity="0.9" />
  </g>
  <g filter="url(#softShadow)">
    <circle cx="560" cy="390" r="170" fill="url(#yolk)" />
    <circle cx="724" cy="494" r="118" fill="url(#yolk)" />
  </g>
  <circle cx="560" cy="390" r="170" fill="none" stroke="#f8d25e" stroke-width="14" opacity="0.35" />
  <circle cx="724" cy="494" r="118" fill="none" stroke="#f8d25e" stroke-width="10" opacity="0.35" />
</svg>
